[defaults]
forks          = 10
gathering = smart
stdout_callback = debug
callbacks_enabled = timer, profile_tasks
remote_user = root
max_diff_size = 99999999

[inventory]

[privilege_escalation]

[paramiko_connection]

[ssh_connection]
pipelining = True

[persistent_connection]

[accelerate]

[selinux]

[colors]

[diff]
always = yes
context = 5
