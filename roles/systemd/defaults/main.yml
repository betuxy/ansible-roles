---
# Three-layer list of unit objects. Each entry must declare both a 'name'
# and a 'type' (e.g. service, timer, socket). Entries sharing the same
# name+type across layers are merged into a single unit; later layers take
# priority. See README.md for the full field schema.
systemd_units_default: []
systemd_units: []
systemd_units_additional: []

# list_merge strategy used to merge nested list-valued directives (e.g.
# After:) when the same name+type appears in more than one layer.
systemd_list_merge_strategy: append_rp

# Run `systemctl daemon-reload` (system and/or user) after deploying units.
systemd_daemon_reload: true

# Run `loginctl enable-linger` for accounts that own user-scoped units, so
# their units can run without an active login session.
systemd_enable_linger: true

# How linger is enabled when systemd_enable_linger is true.
#   file    - creates /var/lib/systemd/linger/<user> directly (idiomatic, no
#             command module, but does not signal the running logind daemon
#             immediately — takes effect on next login or logind restart).
#   command - runs `loginctl enable-linger <user>` via the command module,
#             which also notifies the running logind via D-Bus so the change
#             takes effect immediately on a live system.
systemd_linger_method: file
