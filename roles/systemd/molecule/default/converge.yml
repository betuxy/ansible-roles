---
- name: Converge
  hosts: all
  become: true
  vars:
    systemd_units_additional:
      - name: molecule-test
        type: service
        sections:
          Unit:
            Description: "Molecule test service"
          Service:
            Type: oneshot
            ExecStart: /bin/true
          Install:
            WantedBy: ["multi-user.target"]
  tasks:
    - name: Include systemd
      ansible.builtin.include_role:
        name: systemd
