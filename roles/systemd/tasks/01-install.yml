---
- name: 01-install | Look up account details for user-scoped unit owners
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
  loop: "{{ _systemd_units_user_accounts }}"
  when: _systemd_units_user_accounts | length > 0

- name: 01-install | Enable lingering for user-scoped unit owners (file)
  ansible.builtin.file:
    path: "/var/lib/systemd/linger/{{ item }}"
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _systemd_units_user_accounts }}"
  when:
    - systemd_enable_linger | bool
    - systemd_linger_method == 'file'

- name: 01-install | Enable lingering for user-scoped unit owners (command)
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ item }}"
  loop: "{{ _systemd_units_user_accounts }}"
  changed_when: false
  when:
    - systemd_enable_linger | bool
    - systemd_linger_method == 'command'
